
  

  
  [package]
name = "vk-tg-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
telers = "1.0.0-beta.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
